name: Documentation

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
    tags: ['v*', 'docs-test']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    outputs:
      base_url: ${{ steps.pages.outputs.base_url }}
    container:
      image: ghcr.io/mach3-software/mach3:alma9latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure GitHub Pages
        id: pages
        if: github.event_name != 'pull_request' && vars.DOCS_PAGES_ENABLED == 'true'
        uses: actions/configure-pages@v5

      - name: Install system dependencies
        run: |
          dnf install --assumeyes python3.12 python3.12-devel flex bison graphviz texlive-scheme-basic perl

      - name: Install documentation dependencies
        run: |
          python3.12 -m venv .venv
          .venv/bin/python -m pip install "cmake>=3.24,<4" numpy -r docs/requirements.txt

      - name: Test versioned publishing
        run: .venv/bin/python -m unittest discover -s .github/CIscripts -p 'test_*.py' -v

      - name: Test documentation extensions
        run: .venv/bin/python -m unittest discover -s docs/_ext -p 'test_*.py' -v

      - name: Build Doxygen 1.9.8
        run: |
          curl --fail --location --retry 3 \
            https://codeload.github.com/doxygen/doxygen/tar.gz/refs/tags/Release_1_9_8 \
            --output "$RUNNER_TEMP/doxygen.tar.gz"
          tar -xzf "$RUNNER_TEMP/doxygen.tar.gz" -C "$RUNNER_TEMP"
          .venv/bin/cmake -S "$RUNNER_TEMP/doxygen-Release_1_9_8" \
            -B "$RUNNER_TEMP/doxygen-build" -DCMAKE_BUILD_TYPE=Release
          .venv/bin/cmake --build "$RUNNER_TEMP/doxygen-build" --target doxygen --parallel 4
          echo "$RUNNER_TEMP/doxygen-build/bin" >> "$GITHUB_PATH"

      - name: Build current MaCh3 and Python bindings
        run: |
          .venv/bin/cmake -S . -B build-docs \
            -DMaCh3_PYTHON_ENABLED=ON \
            -DPython_EXECUTABLE="$PWD/.venv/bin/python" \
            -DMaCh3_GPU_ENABLED=OFF \
            -DNuFastLinear_ENABLED=ON
          .venv/bin/cmake --build build-docs --parallel 4
          .venv/bin/cmake --install build-docs

      - name: Verify current Python bindings
        env:
          PYTHONPATH: ${{ github.workspace }}/build-docs
        run: |
          export LD_LIBRARY_PATH="$PWD/build-docs/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          .venv/bin/python - <<'PY'
          from pathlib import Path
          import pyMaCh3
          from pyMaCh3 import manager, samples, splines, fitters, parameters, plotting
          expected = Path("build-docs/pyMaCh3").resolve()
          assert Path(pyMaCh3.__file__).resolve().parent == expected
          print(f"Documenting {pyMaCh3.__file__}")
          PY

      - name: Build documentation
        env:
          PYTHONPATH: ${{ github.workspace }}/build-docs
          MACH3_EXECUTABLE: ${{ github.workspace }}/build-docs/bin/mach3
          DOCS_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'develop' }}
          DOCS_VERSIONS_URL: ${{ steps.pages.outputs.base_url || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}/versions.json
        run: |
          export LD_LIBRARY_PATH="$PWD/build-docs/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          .venv/bin/sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Upload documentation for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SphinxHTML
          path: docs/_build/html
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/tags/docs-test') && github.event_name != 'pull_request' && vars.DOCS_PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: documentation-pages
      cancel-in-progress: false
      queue: max
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout publishing tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download current documentation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SphinxHTML
          path: current-docs

      - name: Restore published versions
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          published=$(git ls-remote --heads origin refs/heads/docs-site)
          if [ -n "$published" ]; then
            git fetch --depth=1 origin refs/heads/docs-site
            git worktree add --detach site FETCH_HEAD
          else
            empty_tree=$(git mktree </dev/null)
            initial_commit=$(printf 'Initialize documentation archive\n' | git commit-tree "$empty_tree")
            git worktree add --detach site "$initial_commit"
          fi

      - name: Preserve upstream Doxygen before migration
        if: github.repository == 'mach3-software/MaCh3'
        shell: bash
        run: |
          if [ ! -f site/legacy/develop/index.html ]; then
            git clone --depth=1 --branch gh-pages \
              https://github.com/mach3-software/MaCh3.git legacy-site
          fi

      - name: Assemble versioned site
        env:
          DOCS_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'develop' }}
          DOCS_BASE_URL: ${{ needs.build.outputs.base_url }}
          PRESERVE_LEGACY: ${{ github.repository == 'mach3-software/MaCh3' }}
        run: |
          options=()
          if [ "$PRESERVE_LEGACY" = "true" ]; then
            options+=(--preserve-legacy)
          fi
          python3 .github/CIscripts/publish_docs.py \
            --source current-docs --destination site \
            --version "$DOCS_VERSION" --base-url "$DOCS_BASE_URL" \
            --legacy-manifest docs/_static/legacy-versions.json \
            --legacy-site legacy-site "${options[@]}"

      - name: Save published versions
        run: |
          git -C site add --all
          if ! git -C site diff --cached --quiet; then
            git -C site commit -m "Update documentation for $GITHUB_REF_NAME"
            git push origin "$(git -C site rev-parse HEAD):refs/heads/docs-site"
          fi

      - name: Upload complete GitHub Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
